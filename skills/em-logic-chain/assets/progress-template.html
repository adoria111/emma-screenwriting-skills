<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
:root{--ink:#183044;--muted:#566879;--blue:#245bbc;--bluewash:#edf3ff;--green:#17645b;--line:#d8e2eb;--paper:#fff;--back:#f4f7fb;--rose:#985363}*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.65}button,summary{font:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #c9841c;outline-offset:4px}header{background:var(--paper);border-bottom:1px solid var(--line)}.header-inner{max-width:1260px;margin:auto;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:19px;font-weight:700}.edition{color:var(--muted);font-size:13px}.wrap{max-width:1260px;margin:auto;padding:26px 32px 60px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tab{padding:9px 18px;border:1px solid var(--line);border-radius:24px;background:white;color:var(--muted)}.tab[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}.intro{margin:32px 0 26px;display:grid;grid-template-columns:1.2fr 1fr;align-items:end;gap:32px}h1{margin:3px 0;font-size:clamp(27px,3.3vw,43px);line-height:1.2;letter-spacing:-1px}.subtitle{color:var(--muted);font-size:16px;margin:10px 0 0}.intro p{margin:0;max-width:40em;color:var(--muted);font-size:15px}.hint{font-size:13px;color:var(--muted);margin:0 0 12px}.track-wrap{overflow-x:auto;padding:0 0 14px}.track{display:grid;grid-template-columns:repeat(var(--count),minmax(152px,1fr));gap:4px}.step{text-align:left;border:0;background:transparent;color:var(--muted);padding:0 10px 7px}.bar{display:block;height:10px;background:#dbe5f2;margin:0 -10px 14px}.step:first-child .bar{border-radius:10px 0 0 10px}.step:last-child .bar{border-radius:0 10px 10px 0}.step.visited .bar{background:#89a9de}.step[aria-pressed=true] .bar{background:var(--blue)}.step[aria-pressed=true]{color:var(--blue)}.step small{font-size:12px}.step strong{display:block;font-size:16px;margin:4px 0}.step span.state-mini{font-size:12px;display:block;line-height:1.5}.detail{background:white;border:1px solid var(--line);border-radius:12px;margin-top:16px;overflow:hidden}.detail-head{padding:23px 28px 19px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}h2{font-size:23px;line-height:1.4;margin:3px 0}.detail-head small{color:var(--muted)}.nav{display:flex;gap:8px;flex-shrink:0}.nav button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:6px;padding:6px 12px;font-size:13px}.nav button:disabled{opacity:.35;cursor:default}.content{padding:24px 28px}.state{font-size:20px;font-weight:650;color:var(--blue);margin:0 0 16px}.reward{display:grid;grid-template-columns:100px 1fr;gap:12px;background:var(--bluewash);border-left:4px solid var(--blue);padding:15px 20px;margin:16px 0}.reward strong{color:var(--blue)}.intent{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0 26px;font-size:14px}.intent p{margin:0}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}h3{font-size:17px;margin:22px 0 14px}.lane{margin:0 0 20px;display:grid;grid-template-columns:142px 1fr;gap:16px}.lane-label{color:var(--green);font-weight:650;font-size:14px;border-left:3px solid #87b8af;padding:6px 0 0 12px}.nodes{display:flex;align-items:stretch;gap:8px}.node{flex:1;display:flex;align-items:center;font-size:14px;line-height:1.6;background:#f3f7fa;border-radius:5px;padding:10px 12px;min-width:0}.arrow{align-self:center;color:#73889c;flex-shrink:0}.why{font-size:13px;color:var(--muted);margin:7px 0 0}.emotion{border-top:1px solid var(--line);padding-top:16px;margin-top:20px;font-size:14px}.emotion b{color:var(--rose)}.bridge{margin-top:16px;background:#eef7f5;border-radius:6px;padding:15px 18px;font-size:14px}.bridge strong{display:block;color:var(--green);margin-bottom:4px}details{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}summary{cursor:pointer;font-size:14px;font-weight:600}.source-text{font-size:13px;color:var(--muted);margin:14px 0 0}.episodes{list-style:none;padding:0}.episodes li{padding:10px 0;border-bottom:1px solid #e8edf3;font-size:14px}.episodes li:last-child{border:0}.footer{margin-top:20px;color:var(--muted);font-size:13px}.footer p{max-width:80em}.method{background:transparent}.method ul{padding-left:22px}.method li{margin:8px 0}.pill{font-size:12px;color:var(--blue);background:var(--bluewash);padding:4px 10px;border-radius:14px;display:inline-block}.fallback{max-width:1100px;margin:20px auto;padding:20px}.fallback article{background:white;padding:20px;margin-bottom:20px}.js .fallback{display:none}.interactive{display:none}.js .interactive{display:block}.print-block{display:none}
@media(max-width:700px){.header-inner{padding:16px 18px}.brand{font-size:17px}.edition{font-size:11px}.wrap{padding:18px 16px 40px}.tabs{gap:6px}.tab{padding:7px 12px;font-size:12px}.intro{grid-template-columns:1fr;gap:15px;margin:24px 0}.detail-head{padding:18px;align-items:flex-start;flex-direction:column}.content{padding:18px}.state{font-size:18px}.reward{grid-template-columns:1fr;gap:3px;padding:12px 15px}.intent{grid-template-columns:1fr}.lane{grid-template-columns:1fr;gap:8px}.nodes{display:grid;grid-template-columns:1fr}.node{padding:9px 12px}.arrow{transform:rotate(90deg);justify-self:center;line-height:1}.lane-label{padding-top:0}.step strong{font-size:15px}.track{grid-template-columns:repeat(var(--count),154px)}h2{font-size:21px}}
@media print{body{background:white;color:#000}.interactive,header,.fallback{display:none!important}.print-block{display:block}.print-block article{break-inside:avoid;padding:10px 0;border-bottom:1px solid #ccc}.print-block h1{font-size:25px}.print-block h2{font-size:19px}.print-block p,.print-block li{font-size:11px}.print-block details{display:block}}

.step{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}.bar{flex-shrink:0}a{color:var(--blue);text-underline-offset:3px}a:focus-visible{outline:3px solid #c9841c;outline-offset:4px}.tab{text-decoration:none;display:inline-block}.tab[aria-current=page]{background:var(--ink);border-color:var(--ink);color:white}.evidence-ref{display:inline-block;font-size:12px;margin:4px 6px 0 0}.deep{font-size:14px}.deep p{margin:10px 0}.deep h4{font-size:15px;margin:18px 0 5px}.deep blockquote{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-left:0}.deep details{margin-top:12px;padding-top:10px}.deep summary{font-size:13px}.deep .refs{display:block}.deep .scene:target{background:var(--bluewash)}.node[data-issue]{border:1px solid #d6b7a2;background:#fcf4ed}.node sup{color:#92512a;margin-left:4px;font-size:10px}.scope{font-size:12px;color:var(--muted);margin:0 0 16px}.view-tools{display:flex;gap:14px;margin-top:20px;font-size:13px}.view-tools button{background:transparent;border:0;color:var(--blue);padding:0;text-decoration:underline}.full-mode .print-block{display:block;max-width:1196px;margin:auto;padding:24px 32px}.full-mode .interactive{display:none}.full-mode .print-block article{background:#fff;padding:24px;margin:16px 0;border:1px solid var(--line);border-radius:12px}.print-block .return{margin:8px 0}.return button{font:inherit;color:var(--blue);border:1px solid var(--line);background:white;border-radius:6px;padding:8px 14px}.static-card h2{margin-top:10px}.static-card .lane{margin-top:16px}p,.node{overflow-wrap:anywhere}.fallback .return{display:none}@media print{.print-block .return{display:none}.print-block{padding:0 18px}.print-block .content{padding:0}.print-block .lane{grid-template-columns:120px 1fr}.print-block details::details-content{content-visibility:visible!important}.print-block details>*:not(summary){display:block!important}.print-block .deep{font-size:11px}.print-block .deep details{break-inside:auto}.print-block article{break-inside:auto}.print-block .lane{break-inside:avoid}.print-block .reward{break-inside:avoid}}
</style></head><body>
<header><div class="header-inner"><div class="brand">艾玛短剧 · 逻辑链</div><div class="edition">__EDITION__</div></div></header>
<main class="wrap interactive"><nav class="tabs" aria-label="选择报告">__NAV__</nav><section class="intro"><div><span class="pill">__THEME__</span><h1>__HEADING__</h1><p class="subtitle">__SUBTITLE__</p></div><p>__INTRO__</p></section><p class="hint">__HINT__</p><div class="track-wrap"><nav class="track" id="track" aria-label="剧情阶段进度条"></nav></div><section class="detail" id="detail" aria-live="polite"></section><div class="view-tools"><button data-all>展开全部阶段</button><button data-print>打印 / 保存PDF</button></div><footer class="footer">__FOOTER__</footer></main>
<section class="fallback">__FALLBACK__</section><section class="print-block"><div class="return"><button data-return>返回进度条视图</button></div>__STATIC__</section><script type="application/json" id="logic-data">__DATA__</script><script>
const report=JSON.parse(document.getElementById('logic-data').textContent);let selected=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const c=report.cards[selected];document.getElementById('track').style.setProperty('--count',report.cards.length);
document.getElementById('track').innerHTML=report.cards.map((x,i)=>`<button class="step ${i<selected?'visited':''}" data-card="${i}" aria-pressed="${i===selected}"><span class="bar" aria-hidden="true"></span><small>${esc(x.label)} · ${esc(x.range)}</small><strong>${esc(x.title)}</strong><span class="state-mini">${esc(x.state)}</span></button>`).join('');
document.getElementById('detail').innerHTML=`<div class="detail-head"><div><small>${esc(c.label)} · ${esc(c.range)}</small><h2>${esc(c.title)}</h2></div><div class="nav"><button data-nav="-1" ${selected===0?'disabled':''}>上一段</button><button data-nav="1" ${selected===report.cards.length-1?'disabled':''}>下一段</button></div></div><div class="content"><p class="state">${esc(c.state)}</p><div class="reward"><strong>${esc(report.rewardLabel||'这一卡的回报')}</strong><div>${esc(c.reward)}</div></div><div class="intent"><p><span class="label">角色要什么</span>${esc(c.goal)}</p><p><span class="label">观众在等什么 · 结构判断</span>${esc(c.viewer)}</p></div><h3>${esc(report.chainLabel||'这个回报，需要哪些条件？')}</h3>${c.chains.map(x=>`<div class="lane"><div class="lane-label">${esc(x.title)}</div><div><div class="nodes">${x.nodes.map(n=>`<div class="node" ${n.issue?'data-issue="'+esc(n.issue)+'"':''}>${esc(n.text)}${n.issue?'<sup>'+esc(n.issue)+'</sup>':''}</div>`).join('<span class="arrow" aria-hidden="true">→</span>')}</div><p class="why">${esc(x.why)}</p></div></div>`).join('')}<div class="emotion"><b>感情为什么改变</b><p>${esc(c.emotion)}</p></div><div class="bridge"><strong>${esc(c.bridgeLabel||'为什么还要有下一卡')}</strong>${esc(c.bridge)}</div>${c.deep}</div>`;
}
function choose(i){selected=Math.max(0,Math.min(i,report.cards.length-1));render();const active=document.querySelector('.step[aria-pressed=true]');active.scrollIntoView({block:'nearest',inline:'nearest'});active.focus({preventScroll:true});}
function goEvidence(id){let t=document.getElementById('live-'+id);if(!t)return;let p=t;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement;}t.scrollIntoView({block:'start'});t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}
document.addEventListener('click',e=>{const c=e.target.closest('[data-card]'),n=e.target.closest('[data-nav]'),a=e.target.closest('[data-ref]'),all=e.target.closest('[data-all]'),back=e.target.closest('[data-return]'),print=e.target.closest('[data-print]');if(c)choose(Number(c.dataset.card));else if(n&&!n.disabled)choose(selected+Number(n.dataset.nav));else if(a){e.preventDefault();goEvidence(a.dataset.ref);}else if(all){document.body.classList.add('full-mode');document.querySelectorAll('.print-block details').forEach(d=>d.open=true);document.querySelector('.print-block').scrollIntoView();}else if(back){document.body.classList.remove('full-mode');document.getElementById('track').scrollIntoView();}else if(print)window.print();});
window.addEventListener('beforeprint',()=>document.querySelectorAll('.print-block details').forEach(d=>d.open=true));
render();document.documentElement.classList.add('js');
</script></body></html>
